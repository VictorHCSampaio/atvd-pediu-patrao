<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a href="/pedidos/novo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente ID</th>
                        <th>Itens</th>
                        <th>Desconto</th>
                        <th>Total</th>
                        <th>Responsável</th>
                        <th>Entrada</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="9" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteId}"></td>
                        <td>
                            <span th:if="${#lists.isEmpty(pedido.itens)}" class="text-muted">—</span>
                            <span th:each="item,stat : ${pedido.itens}">
                                <span th:text="${item.quantidade} + 'x ' + ${item.nome}"></span><span th:if="${!stat.last}">, </span>
                            </span>
                        </td>
                        <td th:text="${pedido.descontoPercentual > 0} ? ${pedido.descontoPercentual} + '%' : '—'"></td>
                        <td th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 2)}"></td>
                        <td th:text="${pedido.responsavelRegistro} ?: '—'"></td>
                        <td th:text="${pedido.dataHoraEntrada != null} ? ${#temporals.format(pedido.dataHoraEntrada, 'dd/MM/yyyy HH:mm')} : '—'"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARACAO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="d-inline-flex gap-1 align-items-center">
                                <form th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline-flex gap-1">
                                    <select name="status" class="form-select form-select-sm" style="width:auto;">
                                        <option value="EM_PREPARACAO">EM_PREPARACAO</option>
                                        <option value="PRONTO">PRONTO</option>
                                        <option value="SAIU_PARA_ENTREGA">SAIU_PARA_ENTREGA</option>
                                        <option value="RETIRADO">RETIRADO</option>
                                        <option value="FINALIZADO">FINALIZADO</option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-outline-primary" title="Atualizar status">
                                        <i class="bi bi-arrow-right-circle"></i>
                                    </button>
                                </form>

                                <button th:if="${perfilLogado == 'GERENTE'}" type="button"
                                        class="btn btn-sm btn-outline-success"
                                        data-bs-toggle="modal" th:attr="data-bs-target='#descontoModal-' + ${pedido.id}" title="Aplicar desconto">
                                    <i class="bi bi-percent"></i>
                                </button>
                                <button th:if="${perfilLogado == 'GERENTE'}" type="button"
                                        class="btn btn-sm btn-outline-danger"
                                        data-bs-toggle="modal" th:attr="data-bs-target='#cancelarModal-' + ${pedido.id}" title="Cancelar pedido">
                                    <i class="bi bi-x-circle"></i>
                                </button>
                            </div>

                            <!-- Modal de desconto -->
                            <div th:if="${perfilLogado == 'GERENTE'}" class="modal fade" th:id="'descontoModal-' + ${pedido.id}" tabindex="-1">
                                <div class="modal-dialog">
                                    <form th:action="@{/pedidos/{id}/desconto(id=${pedido.id})}" method="post" class="modal-content text-start">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Aplicar desconto</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body">
                                            <label class="form-label">Percentual (máx. 20%)</label>
                                            <input type="number" name="percentual" class="form-control" min="1" max="20" step="1" required/>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                                            <button type="submit" class="btn btn-success">Aplicar</button>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <!-- Modal de cancelamento -->
                            <div th:if="${perfilLogado == 'GERENTE'}" class="modal fade" th:id="'cancelarModal-' + ${pedido.id}" tabindex="-1">
                                <div class="modal-dialog">
                                    <form th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post" class="modal-content text-start">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Cancelar pedido</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body">
                                            <label class="form-label">Justificativa</label>
                                            <textarea name="justificativa" class="form-control" rows="3" required></textarea>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Voltar</button>
                                            <button type="submit" class="btn btn-danger">Confirmar cancelamento</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>
